# 复制为 config.yaml 后按需修改；config.yaml 含密钥，已被 .gitignore 忽略。
addr: ":8080"
db_path: palpable.db  # SQLite 文件，不入库

# 设备认证，见 docs/trust.md §2。open：首次上线登记公钥（演示默认）；manifest：只认出厂清单；off：不认证（仅供固件过渡）。
auth:
  enrollment: open

# 家长端微信小程序登录：两项都填才开放微信登录。secret 只放在这里，不入库。
wechat:
  app_id: ""
  secret: ""

# 演示预置：新设备自动绑定到这个家长，并预置声纹登记的同意（产品里由家长端取得）。
demo:
  guardian: demo-parent
  guardian_name: 朵朵妈妈
  voice_consent: true    # 引导期做声音登记；false 则跳过
  parent_token: palpable-demo   # 家长端（Web 手机窗口）用的令牌
  friend_needs_approval: false  # 演示预置的交友方式：false → "孩子自己交友、事后通知"（两个孩子都说好即成为好友）；true → 每个新朋友都需家长同意。产品默认需家长同意
  world: true                 # 开放 /world 演示地图（会暴露所有设备位置，只在演示时打开）

# 不填 ws_url 则不启用 AI 对话。
linx:
  ws_url: wss://xrobo-io.qiniuapi.com/v1/ws/
  token: ""
  api_base: https://xrobo.qiniu.com   # REST 地址
  ota_url: https://xrobo.qiniu.com/xiaozhi/ota/   # 激活预注册的设备
  voiceprint_base: ""   # 声纹服务地址（演示环境）

# 与厂家后台（palpable-admin）的对接，见 docs/factory.md §5。令牌与密钥至少 16 位，不入库。
# /internal/ 与 /ws 同端口，反向代理必须屏蔽 /internal/，只对后台所在内网开放。
ops:
  token: ""          # 非空才开放 /internal/devices/*，后台带它来调用
  admin_url: ""      # 非空才向后台推送绑定/解绑事件，例如 http://127.0.0.1:8090
  admin_token: ""    # 推送时带的令牌，等于后台的 inbound_token
  owner_hmac_key: "" # 家长标识 → owner_ref 的 HMAC 密钥；admin_url 非空时必填，不得发给后台
