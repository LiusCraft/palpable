# 复制为 config.yaml 后按需修改；config.yaml 含密钥，已被 .gitignore 忽略。
addr: ":8080"
db_path: palpable.db  # SQLite 文件，不入库

# 演示预置：新设备自动绑定到这个家长，并预置声纹登记的同意（产品里由家长端取得）。
demo:
  guardian: demo-parent
  guardian_name: 朵朵妈妈
  voice_consent: true    # 引导期做声音登记；false 则跳过
  parent_token: palpable-demo   # 家长端（Web 手机窗口）用的令牌
  friend_needs_approval: false  # 默认贴近即成为好友、家长收到通知；true 则需家长先确认
  world: true                 # 开放 /world 演示地图（会暴露所有设备位置，只在演示时打开）

# 不填 ws_url 则不启用 AI 对话。
linx:
  ws_url: wss://xrobo-io.qiniuapi.com/v1/ws/
  token: ""
  api_base: https://xrobo.qiniu.com   # REST 地址
  ota_url: https://xrobo.qiniu.com/xiaozhi/ota/   # 激活预注册的设备
  voiceprint_base: ""   # 声纹服务地址（演示环境）
