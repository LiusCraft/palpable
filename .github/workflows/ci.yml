name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: make check

      - name: Install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke test
        working-directory: web
        run: pnpm run test:smoke

      - name: Run race detector
        working-directory: server
        run: go test -race ./internal/...

      - name: Read total coverage
        id: coverage
        working-directory: server
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub(/%$/, "", $NF); print $NF}')
          test -n "$total"
          echo "total=${total}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: server/coverage.out
          if-no-files-found: error

  firmware:
    name: Firmware protocol and gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Prepare pinned firmware hardware layer
        run: make firmware-prepare
      - name: Test firmware client and real gateway
        run: make firmware-smoke

  # 只在 main 上发布徽章（手动触发也必须是 main）；PR 不写仓库
  badge:
    name: Update coverage badge
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build badge
        env:
          COVERAGE: ${{ needs.check.outputs.coverage }}
        run: bash .github/scripts/coverage-badge.sh "$COVERAGE" > "$RUNNER_TEMP/coverage.svg"

      # README 引用 badges 分支上的 SVG，main 保持干净；GITHUB_TOKEN 推送到非 main 分支不会再触发工作流
      - name: Push badge to badges branch
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/badges"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges
            git worktree add "$worktree" FETCH_HEAD
          else
            git worktree add --detach "$worktree"
            git -C "$worktree" checkout --orphan badges
            git -C "$worktree" rm -rf . >/dev/null
          fi

          cp "$RUNNER_TEMP/coverage.svg" "$worktree/coverage.svg"
          git -C "$worktree" add coverage.svg
          if git -C "$worktree" diff --cached --quiet; then
            echo "覆盖率未变化，跳过提交"
            exit 0
          fi

          git -C "$worktree" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: 更新测试覆盖率徽章"
          git -C "$worktree" push origin HEAD:badges
